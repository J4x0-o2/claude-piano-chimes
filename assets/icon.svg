<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">piano-chimes</title>
  <defs>
    <!-- iOS-style background: calm dusk gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#A9B8F0"/>
      <stop offset="0.5" stop-color="#7E86D6"/>
      <stop offset="1" stop-color="#4E4A9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E6FF"/>
    </linearGradient>
    <linearGradient id="petalSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#D9D5FA" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2B2670" flood-opacity="0.28"/>
    </filter>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="430" r="470" fill="url(#glow)"/>

    <!-- Calm ripples: sound fading out like a breath -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M232 640 Q512 760 792 640" stroke-width="10" stroke-opacity="0.30"/>
      <path d="M172 700 Q512 850 852 700" stroke-width="8" stroke-opacity="0.18"/>
      <path d="M122 762 Q512 940 902 762" stroke-width="6" stroke-opacity="0.10"/>
    </g>

    <!-- Lotus -->
    <g filter="url(#soft)">
      <path d="M512 610 C380 600 268 540 222 448 C320 436 430 470 512 610 Z" fill="url(#petalSide)"/>
      <path d="M512 610 C644 600 756 540 802 448 C704 436 594 470 512 610 Z" fill="url(#petalSide)"/>
      <path d="M512 612 C418 560 360 470 372 352 C446 392 500 480 512 612 Z" fill="url(#petal)" fill-opacity="0.95"/>
      <path d="M512 612 C606 560 664 470 652 352 C578 392 524 480 512 612 Z" fill="url(#petal)" fill-opacity="0.95"/>
      <path d="M512 614 C448 540 430 400 512 268 C594 400 576 540 512 614 Z" fill="url(#petal)"/>
    </g>

    <!-- A single soft note resting above the lotus -->
    <circle cx="512" cy="196" r="14" fill="#FFFFFF" fill-opacity="0.85"/>

    <rect width="1024" height="1024" fill="url(#gloss)"/>
  </g>
</svg>
